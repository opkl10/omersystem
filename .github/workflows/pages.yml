name: Deploy to GitHub Pages

# מושבת זמנית מדחיפות: GitHub Pages עדיין לא הופעל בהגדרות הרפוזיטורי,
# ולכן הריצות נכשלו על כל דחיפה. אחרי הפעלת Pages (Settings ← Pages ←
# Source: GitHub Actions) יש להחזיר את טריגר ה-push או להריץ ידנית.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
